<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Teachers' Day 2026</title>
    <link rel="stylesheet" href="css/universe.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        .final-greeting {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 30px #38bdf8, 0 0 60px #fff;
            text-align: center;
            opacity: 0;
            transform: scale(0.8);
        }
        
        @media (max-width: 768px) {
            .final-greeting { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- White flash overlay from white hole -->
    <div id="entry-flash" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 20; pointer-events: none;"></div>

    <div id="ui-layer" style="pointer-events: auto;">
        <div class="final-greeting" id="finalGreeting">
            🎓 HAPPY TEACHERS' DAY
            <p style="font-family: 'Inter', sans-serif; font-size: 1.2rem; font-weight: 300; margin-top: 1rem; color: #e2e8f0; text-shadow: none;">From Batch-2023 FYUGP BSc Statistics Honours, Department of Statistics, Goalpara College - 2026</p>
        </div>
        
        <div style="position: absolute; bottom: 20px; right: 20px; color: rgba(226, 232, 240, 0.6); font-family: 'Inter', sans-serif; font-size: 0.9rem; z-index: 100; text-align: right; pointer-events: none;">
            Created by Mehdi Hassan<br>
            BSc Statistics, 4th year
        </div>
    </div>

    <script src="js/CosmicEngine.js"></script>
    <script>
        const engine = new CosmicEngine('canvas-container');
        
        document.addEventListener('DOMContentLoaded', () => {
            const flash = document.getElementById('entry-flash');
            const greeting = document.getElementById('finalGreeting');
            
            // Slow fade from white for dramatic effect
            gsap.to(flash, {
                opacity: 0,
                duration: 4,
                ease: "power1.inOut",
                onComplete: () => {
                    flash.style.display = 'none';
                    
                    // Reveal greeting
                    gsap.to(greeting, {
                        opacity: 1,
                        scale: 1,
                        duration: 3,
                        ease: "back.out(1.2)"
                    });
                }
            });
        });
    </script>
</body>
</html>
